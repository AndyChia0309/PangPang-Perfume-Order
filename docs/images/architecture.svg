<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="所有訂單都經過 Worker，瀏覽器不直接連資料庫" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="13">
  <rect width="760" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a8f8f"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" font-weight="600" fill="#241f1f">所有訂單都經過 Worker，瀏覽器不直接連資料庫</text>

  <g fill="none" stroke="#9a8f8f" stroke-width="1.25">
    <path d="M104 150V76H210" marker-end="url(#arrow)"/>
    <path d="M350 140V100" marker-end="url(#arrow)"/>
    <path d="M184 190H280" marker-end="url(#arrow)"/>
    <path d="M280 226H184" marker-end="url(#arrow)"/>
    <path d="M480 164H560" marker-end="url(#arrow)"/>
    <path d="M480 244H560" marker-end="url(#arrow)"/>
  </g>

  <rect x="210" y="52" width="180" height="48" rx="8" fill="none" stroke="#9a8f8f" stroke-width="1.25"/>
  <text x="300" y="80" text-anchor="middle" font-weight="600" fill="#241f1f">Cloudflare Turnstile</text>

  <rect x="24" y="150" width="160" height="96" rx="8" fill="none" stroke="#9a8f8f" stroke-width="1.25"/>
  <text x="104" y="176" text-anchor="middle" font-weight="600" fill="#241f1f">瀏覽器（React）</text>
  <text x="104" y="200" text-anchor="middle" font-size="11.5" fill="#6b6060">四步驟訂購表單</text>
  <text x="104" y="218" text-anchor="middle" font-size="11.5" fill="#6b6060">顯示訂單編號</text>

  <rect x="280" y="140" width="200" height="120" rx="8" fill="#f7eeee" stroke="#8c2b2b" stroke-width="2"/>
  <text x="380" y="164" text-anchor="middle" font-weight="600" fill="#241f1f">Cloudflare Worker</text>
  <text x="296" y="186" font-size="11.5" fill="#241f1f">1 限流（每分鐘 5 次）</text>
  <text x="296" y="204" font-size="11.5" fill="#241f1f">2 驗證 Turnstile token</text>
  <text x="296" y="222" font-size="11.5" fill="#241f1f">3 驗證訂單、後端算金額</text>
  <text x="296" y="240" font-size="11.5" fill="#241f1f">4 寫入資料庫、背景寄信</text>

  <rect x="560" y="128" width="176" height="72" rx="8" fill="none" stroke="#9a8f8f" stroke-width="1.25"/>
  <text x="648" y="154" text-anchor="middle" font-weight="600" fill="#241f1f">Supabase</text>
  <text x="648" y="178" text-anchor="middle" font-size="11.5" fill="#6b6060">orders，30 天清除個資</text>

  <rect x="560" y="220" width="176" height="72" rx="8" fill="none" stroke="#9a8f8f" stroke-width="1.25"/>
  <text x="648" y="246" text-anchor="middle" font-weight="600" fill="#241f1f">EmailJS + Gmail</text>
  <text x="648" y="270" text-anchor="middle" font-size="11.5" fill="#6b6060">確認信、新訂單通知</text>

  <g font-size="11.5" fill="#6b6060">
    <text x="96" y="118" text-anchor="end">取得 token</text>
    <text x="358" y="124">siteverify</text>
    <text x="232" y="182" text-anchor="middle">FormData</text>
    <text x="232" y="242" text-anchor="middle">訂單編號</text>
    <text x="520" y="156" text-anchor="middle">secret key</text>
    <text x="520" y="236" text-anchor="middle">寄信</text>
  </g>
</svg>
